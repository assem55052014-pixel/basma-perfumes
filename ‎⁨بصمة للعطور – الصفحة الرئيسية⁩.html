c3d8963f418', tag: 'شرقي دافئ · عنبر وتبغ',\n        desc: 'عطر شرقي فاخر يقوم على عنبر دافئ يتخلله تبغ أشقر بنفحة مدخّنة. يفتتح بحمضيات مشرقة وتوابل منعشة، ثم ينفتح قلبه على أزهار غنية وفواكه مجففة، ويستقر على قاعدة كثيفة من الفانيلا والتونكا واللابدانوم.',\n        top: 'برتقال مرّ، برغموت، جريب فروت، هيل، فلفل وردي، زنجبيل، لبان، روم',\n        heart: 'تبغ أشقر، زعفران، ياسمين، مسك الروم، أوسمانثوس، خشب الصندل، فواكه مجففة، جذور السوسن',\n        base: 'فانيلا، فول التونكا، لابدانوم، مرّ، باتشولي، مسك، أرز، فيتيفر' },\n      { name: 'سيّد الوادي', img: '/_blob/228cbb94b2dc9e9bebb519effdbf7b97', tag: 'عنبري خشبي · عود وجلد',\n        desc: 'عطر عنبري خشبي قوي الحضور يوازن بين الانتعاش العطري والعمق الحسي. يبدأ بنفحة مشرقة من الدافانا والبرغموت الإيطالي مع حرارة الفلفل الوردي، ثم يتجه قلبه إلى العنبر الأبيض والعود وإكليل الجبل، ويستقر على جلد ناعم ومسك وفيتيفر.',\n        top: 'دافانا، برغموت إيطالي، فلفل وردي',\n        heart: 'عنبر أبيض، إكليل الجبل (روزماري)، عود',\n        base: 'مسك، جلد، فيتيفر هايتي' },\n      { name: 'ياقوت', img: '/_blob/38ba7075229789423689f93afe1c240c', tag: 'زهري شرقي · ورد وكركديه',\n        desc: 'عطر زهري شرقي مستوحى من شاي الكركديه، يتألق فيه الورد الدمشقي والكركديه بلون ياقوتي مع رمان مهروس وكشمش أسود. يمنحه النعناع والقرفة انتعاشاً وحرارة، وتضفي قاعدة الفانيلا والجلد والمسك دفئاً ناعماً يدوم طويلاً.',\n        top: 'نعناع أخضر، قرفة',\n        heart: 'ورد دمشقي، كركديه، رمان، كشمش أسود، جلد',\n        base: 'فانيلا، مسك الأمبريت، عنبر' },\n      { name: 'الشهم', img: '/_blob/b26d4ff6fcba2d77b41fe468ffbed9c3', tag: 'عنبري زهري · تفاح وخزامى',\n        desc: 'عطر أنيق يمزج انتعاش التفاح بهدوء الخزامى ويلتفّ بعمق الباتشولي الترابي. تتكشف في قاعدته الفانيلا والأخشاب الثمينة مع لمسة براليني وقهوة مكرملة تمنحه شخصية جذابة وحضوراً لافتاً.',\n        top: 'تفاح، برغموت، هيل',\n        heart: 'خزامى، بنفسج، جيرانيوم',\n        base: 'باتشولي، فانيلا، خشب الغاياك، براليني' },\n      { name: 'سلطان', img: '/_blob/69390a8f7a1242e572f57697cf814bce', tag: 'شرقي حار · فانيلا وتبغ',\n        desc: 'عطر خشبي حار بدخان الفانيلا، يفتتح بقرفة وفلفل دافئين، ثم يكشف قلباً قوياً من أوراق التبغ واللبان والسيستوس والأوسمانثوس، قبل أن يستقر على قاعدة من قرون الفانيلا والمسك والباتشولي والأخشاب.',\n        top: 'قرفة، فلفل',\n        heart: 'أوراق التبغ، لبان، سيستوس، أوسمانثوس',\n        base: 'قرون الفانيلا، مسك، باتشولي، أخشاب' },\n      { name: 'عزيمة', img: '/_blob/f3b203f80d3015ce7dacf11fe5e661f5', tag: 'عنبري خشبي · خزامى وفانيلا',\n        desc: 'عطر جريء وقوي يجمع فلفلاً وردياً حاراً مع كستناء محلّاة في الافتتاحية، ثم قلباً عطرياً من الخزامى والمريمية، وينتهي بقاعدة غنية من خشب العنبر والفانيلا تمنحه أثراً دافئاً ومركّزاً.',\n        top: 'فلفل وردي، كستناء محلّاة',\n        heart: 'خزامى، مريمية',\n        base: 'خشب العنبر، فانيلا' },\n      { name: 'فتنة', img: '/_blob/dd27dc123ed8450c69be0372645a55bb', tag: 'شرقي حار · روم وتبغ',\n        desc: 'عطر دافئ ومسكر تفتتحه القرفة والروم، ويحمل قلبه التبغ والزعفران بعمق غامض، ثم يتلاشى على قاعدة كريمية من خشب الصندل والهيديون مع دفء الفانيلا.',\n        top: 'قرفة، روم',\n        heart: 'تبغ، زعفران',\n        base: 'خشب الصندل، هيديون، فانيلا' },\n      { name: 'الطالع', img: '/_blob/8ec8c63361fc62d5bcdec3810ba6feed', tag: 'خشبي حلو · برقوق وبندق',\n        desc: 'عطر خشبي حلو مرح، يفتح بعصارة البرقوق ونفحات بحرية وحمضيات، ثم يدفأ بالبندق والعسل والياسمين وزهر البرتقال، ويستقر على قاعدة من خشب العنبر والباتشولي والفيتيفر وطحلب السنديان.',\n        top: 'برقوق، نفحات بحرية، جريب فروت، برغموت',\n        heart: 'بندق، عسل، ياسمين، زهر البرتقال، أرز، خشب الكشمير',\n        base: 'خشب العنبر، باتشولي، فيتيفر، طحلب السنديان' },\n      { name: 'ربّان', img: '/_blob/588e64cd7789da3661845a6ac51235bf', tag: 'عنبري خشبي · هيل وفانيلا',\n        desc: 'عطر مكثّف بأثر عنبري خشبي أنيق يعكس حضور القائد. يفتتح بالهيل الحاد، وينتعش قلبه بالخزامى والسوسن، ثم تغمره قاعدة فانيلا قوية وآسرة.',\n        top: 'هيل',\n        heart: 'خزامى، سوسن',\n        base: 'فانيلا' },\n      { name: 'هيبة', img: '/_blob/91b2b776af64353433f272ec90f2d585', tag: 'خشبي زهري · سوسن وخزامى',\n        desc: 'عطر راقٍ يقوم على سوسن بودري أنيق تحيط به الخزامى، وتمنحه الأمبريت والكمثرى نعومة كريمية دافئة. يستقر على قاعدة جافة من خشب الأرز والفيتيفر تمنحه وقاراً وحضوراً هادئاً يليق بالأمسيات والأجواء الباردة.',\n        top: 'خزامى',\n        heart: 'سوسن، أمبريت (حب المسك)، كمثرى',\n        base: 'أرز فرجينيا، فيتيفر' },\n      { name: 'عبق البن', img: '/_blob/3834278e58f0f4a7af3b879ff8da483e', tag: 'شرقي حلو · قهوة وفانيلا',\n        desc: 'عطر شهي تتصدره القهوة العربية، يفتتح بتوابل دافئة من القرفة والهيل والزنجبيل، ثم ينفتح قلبه على البرالين والفواكه المسكّرة والأزهار البيضاء، ويستقر على قاعدة من القهوة والفانيلا والتونكا واللبان الجاوي والمسك.',\n        top: 'قرفة، هيل، زنجبيل',\n        heart: 'براليني، فواكه مسكّرة، أزهار بيضاء',\n        base: 'قهوة، فانيلا، فول التونكا، لبان جاوي، مسك' },\n      { name: 'نشوة', img: '/_blob/ad3ac2779602176e90a80ccfc872c72e', tag: 'شرقي حار · تمر وفانيلا',\n        desc: 'عطر شرقي حلو بدفء التوابل، تفتتحه حمضيات البرغموت مع القرفة وجوزة الطيب، ويحتضن قلبه التمر والبراليني ومسك الليل، ثم يستقر على قاعدة غنية من الفانيلا والتونكا والعنبر والمرّ واللبان الجاوي.',\n        top: 'برغموت، قرفة، جوزة الطيب',\n        heart: 'تمر، براليني، مسك الروم، زنبق الوادي',\n        base: 'فانيلا، فول التونكا، خشب العنبر، مرّ، لبان جاوي' }\n    ];\n    const winfo = [\n      { name: 'عقيلة', img: '/_blob/5701b6e8d5718a543d683e64a43ad19c', tag: 'زهري فاكه · خوخ وأناناس',\n        desc: 'عطر نسائي أنيق يجمع نضارة الفاكهة بنعومة الأزهار، يفتتح بخوخ عصيري وزهر التفاح، ثم ينفتح قلبه على زهر الأناناس وزهر البرتقال الكريمي، ويستقر على قاعدة ناعمة من الورد البري والمسك والباتشولي. أنوثة راقية بأثر مخملي يدوم.',\n        top: 'خوخ، زهر التفاح',\n        heart: 'زهر الأناناس، زهر البرتقال',\n        base: 'ورد بري، مسك، باتشولي، عنبر' },\n      { name: 'شهد', img: '/_blob/adb02e4ca00501db2d91a205a30a4db1', tag: 'جورماند حلو · كراميل وحليب',\n        desc: 'عطر حلو دافئ يشبه الحلوى الفاخرة، يبدأ بكراميل وحليب وسكر في افتتاحية كريمية مغرية، ثم يتفتح قلبه على العسل والأزهار البيضاء، ويستقر على فانيلا وبراليني ومسك ناعم. مثالي لمحبات الحلاوة الدافئة.',\n        top: 'كراميل، حليب، سكر',\n        heart: 'عسل، أزهار بيضاء',\n        base: 'فانيلا، براليني، مسك' },\n      { name: 'سَمَر', img: '/_blob/55eadb00428eb5d658a853254f351a44', tag: 'شرقي دخاني · تبغ وكراميل',\n        desc: 'عطر شرقي جريء بروح السهرات العربية. تفتتحه رائحة التبغ مع الزعفران والسوسن البودري، ويحتضن قلبه فادج الكراميل المملح وفول التونكا والورد، ثم يستقر على قاعدة دخانية دافئة من القهوة والعنبر والباتشولي والمسك. حضور قوي وثبات طويل.',\n        top: 'تبغ، زعفران، سوسن',\n        heart: 'فادج كراميل مملح، فول التونكا، ورد',\n        base: 'قهوة، دخان، عنبر، باتشولي، مسك' },\n      { name: 'إشراق', img: '/_blob/8a177c8faff88b81332f4f5b1087c55a', tag: 'مسك توابل · قرفة وفانيلا',\n        desc: 'عطر مسكي مشرق دافئ كأشعة الشمس على البشرة. يفتتح بقرفة وهيل وبرغموت وزهر البرتقال، ثم تظهر الفانيلا والإيليمي في القلب، وتستقر القاعدة على مسك ولوز حلو وخشب الغاياك والأمبروكسان. دفء مريح وإطلالة نابضة بالحياة.',\n        top: 'قرفة، برغموت، هيل، زهر البرتقال',\n        heart: 'فانيلا، إيليمي',\n        base: 'مسك، لوز حلو، خشب الغاياك، أمبروكسان' },\n      { name: 'بدر', img: '/_blob/8a00257806359e9d926b3ca98efbecc1', tag: 'زهري مسكي · ورد وليتشي',\n        desc: 'عطر زهري مسكي ناعم يجمع الرومانسية بالحداثة. يبدأ بليتشي عصيري وراوند حامض وبرغموت مع لمسة جوزة الطيب، ثم يزهر الورد التركي والفاوانيا والمسك والفانيلا، وتستقر القاعدة على خشب الأرز والبخور والكشمير والفيتيفر. نعومة متوهجة كضوء القمر.',\n        top: 'ليتشي، راوند، برغموت، جوزة الطيب',\n        heart: 'ورد تركي، فاوانيا، مسك، بتاليا، فانيلا',\n        base: 'خشب الأرز، بخور، كشمير، فيتيفر هايتي' },\n      { name: 'فردوس', img: '/_blob/2f1d5dc7f27d4d8da41689084435689e', tag: 'فاكهي شرقي · كمثرى وفانيلا',\n        desc: 'عطر نسائي جذاب يفيض بالإغراء، يفتتح بكمثرى خضراء عصيرية، ثم يتفتح الياسمين مع الفانيلا الناعمة في القلب، وتستقر القاعدة على فول التونكا والفانيلا الدافئة. حلاوة مضيئة وأثر آسر لا يُقاوَم.',\n        top: 'كمثرى',\n        heart: 'ياسمين، فانيلا',\n        base: 'فول التونكا، فانيلا' },\n      { name: 'ريحانة', img: '/_blob/d9ccc9b78dd8006675aec05f9ad70758', tag: 'فاكهي جورماند · توت وبنفسج',\n        desc: 'عطر فاكهي زهري مفعم بالحيوية، يفتتح بباقة توت مهروس من التوت الأسود والأزرق والعليق مع الكرز والفراولة، ثم ينتقل إلى قلب من الياسمين والبنفسج، ويستقر على أخشاب بيضاء ومسك وعنبر جاف وفانيلا. حلاوة مرحة بلمسة أنثوية أنيقة.',\n        top: 'توت أسود، توت أزرق، توت العليق، كرز، فراولة',\n        heart: 'ياسمين، بنفسج',\n        base: 'أخشاب بيضاء، مسك، عنبر جاف، فانيلا، باتشولي' },\n      { name: 'غادة', img: '/_blob/46946eb4361a8a9e48810ab5daef02d9', tag: 'وردي ملكي · ورد وليتشي',\n        desc: 'عطر وردي فخم يحكي رقة الأميرات. يفتتح بليتشي عصيري وراوند وبرغموت، ثم يتفتح الورد الدمشقي والفاوانيا في القلب، وتستقر القاعدة على الكشمير والمسك والفيتيفر. رومانسية راقية وثبات طويل.',\n        top: 'ليتشي، راوند، برغموت، جوزة الطيب',\n        heart: 'ورد دمشقي، فاوانيا',\n        base: 'كشمير، مسك، فيتيفر' },\n      { name: 'نقاء', img: '/_blob/addd78452961896b865fdd04a928179d', tag: 'حمضي مسكي · نظافة وانتعاش',\n        desc: 'عطر صافٍ منعش بإحساس النظافة. يفتتح بحمضيات البرتقال والبرغموت والليمون، ويحمل قلبه لمسة فاكهية ناعمة، وتستقر القاعدة على المسك الأبيض والعنبر والفانيلا. خفيف ومشرق يناسب النهار واللقاءات اليومية.',\n        top: 'برتقال، برغموت، ليمون',\n        heart: 'فواكه',\n        base: 'مسك أبيض، عنبر، فانيلا' },\n      { name: 'شغف', img: '/_blob/aacc4ab7cced67aa55eed3baadfbf5b2', tag: 'غاردينيا عسلي · فانيلا سوداء',\n        desc: 'عطر جريء مغرٍ لا يعرف الهدوء. يفتتح بعسل وبرتقال دموي لافت، ثم تتفتح الغاردينيا الكريمية في القلب، وتستقر القاعدة على باتشولي وفانيلا سوداء وأمبروكسان. حضور أنثوي طاغٍ وثبات يخطف الأنظار.',\n        top: 'عسل، برتقال دموي',\n        heart: 'غاردينيا',\n        base: 'باتشولي، فانيلا سوداء، أمبروكسان' },\n      { name: 'دُرّة', img: '/_blob/a34db84bd547e2fe28fe7bce1d4c7b20', tag: 'زهري شرقي · غاردينيا وعنبر',\n        desc: 'عطر أنثوي غامض كجوهرة سوداء. يبدأ بتوابل الهيل والفلفل والزنجبيل، ثم تتفتح الغاردينيا والفاوانيا وزهر البرتقال في القلب، وتستقر القاعدة على العنبر والصندل والمسك. فخامة مسائية بأثر دافئ آسر.',\n        top: 'هيل، فلفل، زنجبيل',\n        heart: 'غاردينيا، فاوانيا، زهر البرتقال',\n        base: 'عنبر، صندل، مسك' }\n    ];\n    const all = [];\n    for (let i = 0; i < 12; i++) all.push(i < info.length ? { id: 'm' + i, cat: 'men', ...info[i] } : { id: 'm' + i, cat: 'men', name: '[اسم العطر ' + ar[i] + ']' });\n    for (let i = 0; i < winfo.length; i++) all.push({ id: 'w' + i, cat: 'women', ...winfo[i] });\n    const cats = [\n      { id: 'all', label: 'الكل (٢٣)' },\n      { id: 'men', label: 'رجالي (١٢)' },\n      { id: 'women', label: 'حريمي (١١)' }\n    ];\n    const catName = { men: 'عطور رجالي', women: 'عطور حريمي' };\n    const sizes = [\n      { id: 'b55', kind: 'bottle', label: '٥٥ مل', full: 'عبوة ٥٥ مل', unit: 300, old: 350 },\n      { id: 'b110', kind: 'bottle', label: '١١٠ مل', full: 'عبوة ١١٠ مل', unit: 600, old: 700 },\n      { id: 't3', kind: 'tester', label: '٣ مل', full: 'تستر ٣ مل', unit: 50 },\n      { id: 't5', kind: 'tester', label: '٥ مل', full: 'تستر ٥ مل', unit: 70 },\n      { id: 't10', kind: 'tester', label: '١٠ مل', full: 'تستر ١٠ مل', unit: 120 }\n    ];\n    const q = s.q.trim();\n    const list = all.filter((p) => (s.cat === 'all' || p.cat === s.cat) && (!q || p.name.includes(q)));\n    const mk = (p, kind) => sizes.filter((z) => z.kind === kind).map((z) => {\n      const active = (s.sel[p.id] || 'b55') === z.id;\n      return {\n        label: z.label,\n        pressed: active ? 'true' : 'false',\n        cls: 'pill ' + (active ? 'pill-on' : 'pill-off'),\n        pick: () => this.setState({ sel: { ...this.state.sel, [p.id]: z.id } })\n      };\n    });\n    const fmt = (n) => n.toLocaleString('ar-EG');\n    const offers = [\n      'عبوة ٥٥ مل بـ٣٠٠ ج.م بدل ٣٥٠',\n      'عبوتين ٥٥ مل + هدية ٣٠ مل',\n      '٣ عبوات ٥٥ مل + هدية ٥٥ مل',\n      'عبوة ١٠٠ مل بـ٦٠٠ ج.م بدل ٧٠٠',\n      'عبوتين ١٠٠ مل + هدية ٥٥ مل'\n    ];\n    const ticker = offers.concat(offers).concat(offers).concat(offers).concat(offers).concat(offers).map((t) => ({ text: t }));\n    const dots = [];\n    for (let i = 0; i < 64; i++) {\n      const size = 3 + ((i * 7) % 5);\n      dots.push({\n        style: 'top:' + ((i * 53 + 7) % 97) + '%;left:' + ((i * 37 + 11) % 100) + '%;width:' + size + 'px;height:' + size + 'px;animation-duration:' + (7 + ((i * 5) % 8)) + 's;animation-delay:-' + ((i * 3) % 12) + 's'\n      });\n    }\n    return {\n      ticker: ticker,\n      dots: dots,\n      onSearch: (e) => this.setState({ q: e.target.value }),\n      noResults: list.length === 0,\n      chips: cats.map((c) => ({\n        label: c.label,\n        cls: 'pill ' + (s.cat === c.id ? 'pill-on' : 'pill-off'),\n        pick: () => this.setState({ cat: c.id })\n      })),\n      products: list.map((p) => {\n        const z = sizes.find((x) => x.id === (s.sel[p.id] || 'b55'));\n        const n = s.qty[p.id] || 1;\n        let gift = '';\n        if (z.id === 'b55') gift = n >= 3 ? 'هدية ٥٥ مل تتضاف تلقائي' : (n === 2 ? 'هدية ٣٠ مل تتضاف تلقائي' : '');\n        if (z.id === 'b110') gift = n >= 2 ? 'هدية ٥٥ مل تتضاف تلقائي' : '';\n        const priced = z.unit !== undefined;\n        // العبوة الواحدة بسعر العرض، ومع عبوتين أو أكثر كل عبوة بسعرها الأصلي وتتضاف الهدية\n        const perUnit = (z.old !== undefined && n >= 2) ? z.old : z.unit;\n        const total = priced ? perUnit * n : 0;\n        const showOld = z.old !== undefined && n === 1;\n        return {\n          name: p.name,\n          catLabel: catName[p.cat],\n          tag: p.tag || 'محاكاة للعطر العالمي',\n          hasInfo: !!p.desc,\n          hasImg: !!p.img,\n          noImg: !p.img,\n          img: p.img || '',\n          desc: p.desc,\n          top: p.top,\n          heart: p.heart,\n          base: p.base,\n          open: !!s.open[p.id],\n          expanded: s.open[p.id] ? 'true' : 'false',\n          arrow: s.open[p.id] ? '▴' : '▾',\n          toggle: () => this.setState({ open: { ...this.state.open, [p.id]: !this.state.open[p.id] } }),\n          bottles: mk(p, 'bottle'),\n          testers: mk(p, 'tester'),\n          selLabel: z.full,\n          qty: fmt(n),\n          dec: () => this.setState({ qty: { ...this.state.qty, [p.id]: Math.max(1, (this.state.qty[p.id] || 1) - 1) } }),\n          inc: () => this.setState({ qty: { ...this.state.qty, [p.id]: Math.min(10, (this.state.qty[p.id] || 1) + 1) } }),\n          gift: gift !== '',\n          giftText: gift,\n          price: priced ? fmt(total) + ' ج.م' : '[السعر] ج.م',\n          hasOld: showOld,\n          oldPrice: showOld ? fmt(z.old) : '',\n          wa: 'https://wa.me/201277376765?text=' + encodeURIComponent(\n            'السلام عليكم، عايز أطلب من بصمة للعطور:\\n' +\n            'العطر: ' + p.name + '\\n' +\n            'النوع: ' + z.full + '\\n' +\n            'الكمية: ' + fmt(n) + '\\n' +\n            (priced ? 'الإجمالي: ' + fmt(total) + ' ج.م\\n' : '') +\n            (gift ? gift + '\\n' : '') +\n            'العنوان: '\n          )\n        };\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
